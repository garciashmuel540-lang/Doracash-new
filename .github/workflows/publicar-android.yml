name: Publicar Doracash Android
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/publicar-android.yml']
permissions:
  actions: read
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Doracash-Android
          run-id: 44657434507
          github-token: ${{ github.token }}
      - name: Verificar la firma y publicar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=$(find . -name app-debug.apk -type f -print -quit)
          verifier=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$verifier" verify --print-certs "$apk"
          mv "$apk" Doracash.apk
          sha256sum Doracash.apk > SHA256SUMS.txt
          gh release create android-prueba-1 Doracash.apk SHA256SUMS.txt --target 336a17ce5dd46cc644e733076ad99244d09206a9 --title "Doracash para Android · prueba 1" --notes "APK de prueba para Android. Firma de desarrollo."
