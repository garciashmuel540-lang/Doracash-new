name: Compilar Doracash
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.kts'
      - '.github/workflows/android.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Preparar firma temporal de prueba
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug"
      - run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Doracash-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publicar base para actualizar con la firma personal
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publicar 1.1]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk Doracash-base.apk
          gh release create doracash-1.1-base Doracash-base.apk --prerelease --target "$GITHUB_SHA" --title "Doracash 1.1 · base para firma personal" --notes "Usar el instalador para actualizar con la firma existente."
