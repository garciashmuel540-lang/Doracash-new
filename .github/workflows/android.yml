name: Compilar Doracash
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.kts'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compilar y probar
        env:
          DORACASH_MOTION_FRAMES: ${{ runner.temp }}/doracash-frames
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Doracash CI"
          gradle assembleDebug testDebugUnitTest
      - name: Mostrar la animación capturada en Android
        run: |
          convert -delay 6 -loop 0 "$RUNNER_TEMP"/doracash-frames/frame-*.png -layers Optimize Doraemon.gif
      - uses: actions/upload-artifact@v4
        with:
          name: Doraemon-en-movimiento
          path: Doraemon.gif
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Doracash-Android-prueba
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publicar:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: android-release
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar versión y firma de distribución
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^ *versionName = "([0-9.]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          test -n "$version" && test -n "$code"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if gh release view "android-v$version" >/dev/null 2>&1; then
            echo "La versión ya está publicada."
          elif [[ "$SIGNING_CONFIGURED" != true ]]; then
            if ! gh release view "firma-local-v$version" >/dev/null 2>&1; then
              echo 'local=true' >> "$GITHUB_OUTPUT"
            fi
            echo "::notice::La versión instalable se publica desde Cloud Shell con la firma original."
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.release.outputs.build == 'true' || steps.release.outputs.local == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.release.outputs.build == 'true' || steps.release.outputs.local == 'true'
        with:
          gradle-version: '9.3.1'
      - name: Firmar y publicar la actualización
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.release.outputs.version }}
          CODE: ${{ steps.release.outputs.code }}
        run: |
          set -euo pipefail
          umask 077
          export KEYSTORE_PATH="$RUNNER_TEMP/doracash-signing"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          unset KEYSTORE_B64
          export KEY_ALIAS="${KEY_ALIAS:-doracash}" KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          gradle assembleRelease
          apk="Doracash-$CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify "$apk"
          sha256sum "$apk" > SHA256SUMS.txt
          gh release create "android-v$VERSION" "$apk" SHA256SUMS.txt --target "$GITHUB_SHA" --latest --title "Doracash $VERSION" --notes "Actualización Android firmada de Doracash."

      - uses: actions/download-artifact@v4
        if: steps.release.outputs.local == 'true'
        with:
          name: Doraemon-en-movimiento
      - name: Preparar el APK para la firma original en Cloud Shell
        if: steps.release.outputs.local == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          CODE: ${{ steps.release.outputs.code }}
        run: |
          set -euo pipefail
          gradle assembleRelease -PdoracashUnsigned=true
          out=app/build/outputs/apk/release
          jq -e --arg v "$VERSION" --argjson c "$CODE" '.applicationId == "com.aistudio.doracash.kmpzqx" and (.elements | length == 1) and .elements[0].versionName == $v and .elements[0].versionCode == $c' "$out/output-metadata.json" >/dev/null
          zip -j "Doracash-para-firmar-$CODE.zip" "$out/app-release-unsigned.apk"
          gh release create "firma-local-v$VERSION" "Doracash-para-firmar-$CODE.zip" Doraemon.gif --target "$GITHUB_SHA" --prerelease --latest=false --title "Base para firmar Doracash $VERSION" --notes "Paquete de distribución para el titular de la firma. La app instalable se publica en android-v$VERSION."
