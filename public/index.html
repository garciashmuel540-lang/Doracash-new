<!doctype html><html lang="es-NI"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#074c49"><title>Doracash · Mis movimientos</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#18332e;font:16px system-ui,sans-serif}main{max-width:660px;margin:auto;padding:22px 18px 50px}header{font-weight:800;font-size:24px;letter-spacing:-1px}section{border-radius:20px;padding:20px;background:white;margin-top:18px}h1,h2,p{margin:0}h1{font-size:16px;font-weight:500}h2{font-size:20px;margin-bottom:14px}.balance{background:#074c49;color:#fff}.total{font-size:clamp(30px,8vw,50px);font-weight:700;overflow-wrap:anywhere}.stats{display:flex;gap:26px;margin-top:14px}.stats small{display:block;color:#bcdfce}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;font-size:14px}input,select,button{font:inherit;border-radius:9px;padding:11px;min-width:0}input,select{border:1px solid #aebeb5;background:white;color:inherit}button{cursor:pointer;border:0;background:#075c52;color:white;font-weight:650}.full{grid-column:1/-1}.row{border-top:1px solid #d9e4dc;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}.detail{overflow-wrap:anywhere}.income{color:#137653}.expense{color:#994931}.date,.hint{font-size:13px;color:#536b61}.hint{margin-top:12px}.small{background:#eff4ee;color:#184d40;font-size:13px;padding:7px 10px}.actions{display:flex;gap:8px;flex-wrap:wrap}#status{margin-top:10px;color:#784506}button[hidden]{display:none}
</style></head><body><main><header>Doracash</header><section class="balance"><h1>Mi saldo</h1><p class="total" id="balance"></p><div class="stats"><div><small>Ingresos</small><strong id="income"></strong></div><div><small>Gastos</small><strong id="expense"></strong></div></div></section><section><h2 id="form-title">Nuevo movimiento</h2><form id="entry"><label>Tipo<select id="kind"><option value="expense">Gasto</option><option value="income">Ingreso</option></select></label><label>Monto (C$)<input id="amount" type="number" inputmode="decimal" step=".01" min=".01" max="999999999" required></label><label class="full">Descripción<input id="description" maxlength="100" required placeholder="Ej. Compra del supermercado"></label><label class="full">Fecha<input id="day" type="date" required></label><button class="full" id="save">Guardar movimiento</button><button class="small full" id="cancel" type="button" hidden>Cancelar edición</button></form><p class="hint">Los datos se guardan en este navegador y dispositivo. Podés exportar una copia de tus movimientos.</p><p id="status" role="status"></p></section><section><h2>Mis movimientos</h2><div id="history"></div><button class="small" id="download" hidden>Exportar movimientos (JSON)</button></section></main><script src="doracash.js" defer></script></body></html>
